# CI for a MacHUD app repo, from hudkit/scripts/hud-ci.yml. Package.swift depends on
# ../hudkit (with its Kits) and ../speakfree (the voice host's dictation), so both are checked
# out next to the app: SpeakFree at the fork's integration/machud branch.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ github.event.repository.name }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hudkit
          path: hudkit
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/speakfree
          ref: integration/machud
          path: speakfree
      - run: swift --version
      - run: swift test
        working-directory: ${{ github.event.repository.name }}
