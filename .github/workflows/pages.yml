# Publishes site/ (the website and the app catalog, catalog.json) to GitHub Pages:
# https://jamesrisberg.github.io/machud/catalog.json
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog.json
        run: jq -e '.schemaVersion == 1 and (.apps | type == "array")' site/catalog.json
      - name: Render the no-JavaScript app list (site/apps.html)
        run: site/generate.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
